name: Release

on:
  push:
    tags:
      - "v0.1.0"

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.20"
          python-version: "3.11"
          enable-cache: false

      - name: Synchronize locked environment
        run: uv sync --dev --locked

      - name: Run release-equivalent acceptance
        run: uv run --no-sync python scripts/check.py

      - name: Build release assets and checksums
        run: uv run --no-sync python scripts/package_release.py

      - name: Create verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "NullStage $GITHUB_REF_NAME"
          --notes-file docs/releases/v0.1.0.md
          release-assets/*
